components:
  schemas:
    BathroomSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          readOnly: true
        started_at:
          type: string
          format: date-time
          title: Início
        ended_at:
          type: string
          format: date-time
          nullable: true
          title: Fim
        duration_seconds:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Duração (s)
        earnings:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Ganhos (R$)
        photo_url:
          type: string
          format: uri
          title: Foto URL
          maxLength: 200
        is_active:
          type: boolean
          readOnly: true
        like_count:
          type: string
          readOnly: true
        comment_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
      required:
      - comment_count
      - created_at
      - id
      - is_active
      - like_count
      - user
    BathroomSessionStop:
      type: object
      properties:
        photo_url:
          type: string
          format: uri
      required:
      - photo_url
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session:
          type: string
          format: uuid
          title: Sessão
        author:
          type: string
          readOnly: true
        text:
          type: string
          title: Comentário
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
      required:
      - author
      - created_at
      - id
      - session
      - text
    CommentRegister:
      type: object
      properties:
        text:
          type: string
          title: Comentário
      required:
      - text
